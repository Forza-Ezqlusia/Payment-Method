        body { background-color: #f7f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; max-width: 450px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; text-align: center; border-top: 8px solid #FFC107; }
        .icon { font-size: 64px; margin-bottom: 20px; color: #00529b; }
        h2 { color: #212529; font-size: 24px; margin-bottom: 15px; font-weight: 700; }
        p { color: #6c757d; font-size: 14px; line-height: 1.6; margin-bottom: 15px; text-align: center; }
        .info-box { background-color: #fff9e6; border: 1px solid #ffe8a1; border-radius: 8px; padding: 15px; text-align: left; margin-top: 25px; margin-bottom: 25px; }
        .info-title { font-weight: bold; color: #856404; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-detail { font-size: 14px; color: #856404; line-height: 1.6; }
        .bri-logo { height: 24px; width: auto; vertical-align: middle; margin-right: 6px; filter: brightness(0) saturate(100%) invert(21%) sepia(90%) saturate(1480%) hue-rotate(185deg) brightness(94%) contrast(103%); }
        .dana-logo { height: 18px; width: auto; vertical-align: middle; margin-right: 6px; }
        .seabank-logo { height: 22px; width: auto; vertical-align: middle; margin-right: 6px; }
        .payment-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; min-height: 30px; margin-bottom: 8px; column-gap: 6px; }
        .payment-logo { width: 80px; display: flex; justify-content: center; align-items: center; }
        .account-value { display: flex; align-items: center; gap: 8px; }
        .account-colon, .account-number, .account-owner { font-size: 18px; }
        .btn { display: inline-block; width: 100%; background-color: #25D366; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
        .btn:hover { background-color: #20ba56; }
        .footer { margin-top: 30px; font-size: 12px; color: #adb5bd; }
    </style>
</head>
