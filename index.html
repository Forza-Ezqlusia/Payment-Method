<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Payment Method — Bee Network</title>
  <style>
    :root{color-scheme:light;--ink:#172538;--muted:#718096;--line:#e8edf2;--gold:#f3ae24;--gold-soft:#fff7e4;--green:#16a765;--navy:#18314d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:32px 18px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% -15%,#fff0c7 0,transparent 42%),#f5f7fa;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
    .page{width:min(100%,480px)}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px;color:var(--navy);font-size:14px;font-weight:800;letter-spacing:.11em}
    .brand-mark{display:block;flex:0 0 36px;width:36px;height:36px;object-fit:contain}
    .card{position:relative;overflow:hidden;background:#fff;border:1px solid #e7ecf2;border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(24,49,77,.09)}
    .card:before{position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#f5b52d,#ffda72);content:""}
    .status{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;padding:8px 12px;border:1px solid #f1dfb4;border-radius:999px;background:#fffaf0;color:#946300;font-size:11px;font-weight:750;letter-spacing:.075em;text-transform:uppercase}
    .status i{width:7px;height:7px;border-radius:50%;background:#e4a719;box-shadow:0 0 0 3px #faedca}
    h1{margin:0 0 18px;text-align:center;font-size:clamp(27px,7vw,34px);line-height:1.12;letter-spacing:-.04em;color:#142b43}
    .intro{margin:0;color:var(--muted);font-size:14px;line-height:1.75}
    .intro strong{color:#34465a}
    .steps{display:flex;align-items:center;gap:11px;margin:24px 0 20px;padding:15px 16px;border-radius:14px;background:#f7f9fb;color:#556578;font-size:12px;line-height:1.5}
    .steps-icon{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid #f2e4c3;border-radius:11px;background:var(--gold-soft);color:#9a6a08}
    .steps b{color:#26384c}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;color:#334459;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .payment{overflow:hidden;border:2px solid #d4deea;border-radius:16px;background:#fff}
    .pay-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 16px;min-height:64px}
    .pay-row+.pay-row{border-top:1px solid var(--line)}
    .pay-left{display:flex;align-items:center;gap:10px;min-width:0}
    .pay-logo{display:grid;place-items:center;flex:0 0 64px;height:34px;border-radius:9px;background:#f7f9fc}.pay-logo.bri img{display:block;width:auto;height:16px;max-width:56px;object-fit:contain}
    .pay-logo.dana svg{display:block;width:auto;height:16px;max-width:56px}.pay-logo.seabank img{display:block;width:auto;height:16px;max-width:56px;object-fit:contain}
    .account-separator{margin-left:-2px;margin-right:-2px;color:#718096;font-weight:700}.pay-meta{min-width:0}
    .account-number{color:#1d3046;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:.025em;white-space:nowrap}
    button{font:inherit}
    .copy-btn{flex:0 0 auto;min-width:54px;padding:9px 12px;border:1px solid #dbe4ee;border-radius:9px;background:#fff;color:#344b63;font-size:11px;font-weight:750;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
    .copy-btn:hover{border-color:#aebfd1;background:#f5f8fb}.copy-btn:focus-visible,.wa:focus-visible{outline:3px solid #f3ae24;outline-offset:3px}.copy-btn:active{transform:scale(.96)}
    .owner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid var(--line);background:#fafbfd;color:#718096;font-size:12px}
    .owner strong{color:#304258;font-size:13px}
    .wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin-top:18px;border-radius:12px;background:#119b5b;box-shadow:0 8px 18px rgba(17,155,91,.18);color:#fff;text-decoration:none;font-size:14px;font-weight:750;transition:transform .18s,background .18s}
    .wa:hover{transform:translateY(-1px);background:#0d874e}.wa svg{width:20px;height:20px;fill:currentColor}
    .note{margin:13px 0 0;text-align:center;color:#8b98a8;font-size:11px;line-height:1.6}
    footer{padding:20px 0 0;text-align:center;color:#98a3b1;font-size:11px;letter-spacing:.025em}
    .toast{position:fixed;right:18px;bottom:18px;padding:11px 15px;border-radius:11px;background:#1c3046;color:#fff;font-size:12px;font-weight:700;box-shadow:0 8px 24px #17253830;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:480px){body{padding:22px 14px}.card{padding:27px 21px;border-radius:20px}.pay-row{padding:13px 12px}.account-number{font-size:13px}.copy-btn{padding:8px 9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>

  <script>
    const toast = document.querySelector('.toast');
    let toastTimer;
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch {
          // Try the browser-compatible fallback below.
        }
      }
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px';
      document.body.appendChild(field);
      field.focus({ preventScroll: true });
      field.select();
      field.setSelectionRange(0, field.value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } finally { field.remove(); }
      if (!copied) throw new Error('Salin gagal');
    }
    document.querySelectorAll('.copy-btn').forEach((button) => {
      button.addEventListener('click', async () => {
        try {
          await copyText(button.dataset.copy);
          toast.textContent = 'Nomor berhasil disalin';
          button.textContent = 'Tersalin';
        } catch {
          toast.textContent = 'Gagal menyalin. Silakan salin nomor secara manual.';
        }
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
          document.querySelectorAll('.copy-btn').forEach((item) => { item.textContent = 'Salin'; });
        }, 1800);
      });
    });
  </script>
